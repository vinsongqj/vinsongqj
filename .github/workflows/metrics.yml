name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # User info
          user: vinsongqj
          
          # Use markdown/plugin-only mode instead of classic dashboard
          template: markdown
          base: ""
          
          # Monotone / Minimal Styling
          config_timezone: Asia/Kuala_Lumpur
          config_font: "JetBrains Mono"
          use_pre_derived_theme: yes
          config_theme: "github-dark"
          
          # Custom Colors
          config_color_background: "0d1117"
          config_color_text: "f0f6fc"
          config_color_primary: "8b949e"
          config_color_border: "30363d"

          # Only Language Plugin Enabled
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
