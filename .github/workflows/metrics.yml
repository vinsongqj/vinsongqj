name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Basic Options
          user: vinsongqj
          template: classic
          base: header
          base_skip: yes
          # Monotone / Minimal Styling
          config_timezone: Asia/Kuala_Lumpur
          config_font: "JetBrains Mono"
          
          # Force a clean dark-monotone preset (or use "light" for white mode)
          use_pre_derived_theme: yes
          config_theme: "github-dark"
          
          # Custom Color Overrides (Pure Black/White/Gray Hex Codes)
          config_color_background: "0d1117" # Deep background
          config_color_text: "f0f6fc"       # Crisp white text
          config_color_primary: "8b949e"    # Monotone muted gray for accents
          config_color_border: "30363d"     # Subtle border color

          # Minimal Plugins (Keep it simple)
          plugin_languages: yes
          plugin_languages_details: percentage
  
